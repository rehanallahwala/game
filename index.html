<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f0f0f0; }
        .container { background: white; margin: 50px auto; padding: 30px; border-radius: 10px; width: 400px; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin: 20px auto; }
        .cell { width: 100px; height: 100px; border: 2px solid #333; background: white; font-size: 36px; cursor: pointer; }
        .cell:hover { background: #f9f9f9; }
        .winner { background: #4CAF50; color: white; }
        .status { font-size: 20px; margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1976D2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Player X's turn</div>
        <div class="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;

        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function makeMove(index) {
            if (board[index] || !gameActive) return;
            
            board[index] = currentPlayer;
            document.getElementsByClassName('cell')[index].textContent = currentPlayer;
            
            if (checkWin()) {
                document.getElementById('status').textContent = `Player ${currentPlayer} wins!`;
                gameActive = false;
                highlightWin();
            } else if (board.every(cell => cell)) {
                document.getElementById('status').textContent = "It's a draw!";
                gameActive = false;
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
            }
        }

        function checkWin() {
            return winPatterns.some(pattern => {
                const [a, b, c] = pattern;
                return board[a] && board[a] === board[b] && board[a] === board[c];
            });
        }

        function highlightWin() {
            winPatterns.forEach(pattern => {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementsByClassName('cell')[a].classList.add('winner');
                    document.getElementsByClassName('cell')[b].classList.add('winner');
                    document.getElementsByClassName('cell')[c].classList.add('winner');
                }
            });
        }

        function resetGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
            
            const cells = document.getElementsByClassName('cell');
            for (let i = 0; i < cells.length; i++) {
                cells[i].textContent = '';
                cells[i].classList.remove('winner');
            }
        }
    </script>
</body>
</html>
